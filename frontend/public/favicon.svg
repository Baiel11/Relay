<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Black Background Circle -->
  <circle cx="50" cy="50" r="50" fill="#050505"/>
  
  <!-- Outer Dark Circle Frame -->
  <circle cx="50" cy="50" r="36" fill="#16161b" stroke="#2a2a32" stroke-width="4"/>
  
  <!-- Subtle Outer Glowing Ring -->
  <circle cx="50" cy="50" r="24" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Center Bright Glowing White Dot -->
  <circle cx="50" cy="50" r="12" fill="#ffffff"/>
</svg>